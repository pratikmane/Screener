name: paper-bot
on:
  schedule:
    - cron: "2,17,32,47 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: paper
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas numpy requests
      - run: python paper_bot.py
        env:
          TWELVE_DATA_KEY: ${{ secrets.TWELVE_DATA_KEY }}
          SYMBOLS: ${{ vars.SYMBOLS || 'EURUSD,XAUUSD' }}
      - name: Save results
        run: |
          git config user.name "paper-bot"
          git config user.email "paper-bot@users.noreply.github.com"
          git add paper
          git diff --cached --quiet || (git commit -m "paper update" && git push)
