name: research
on:
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas numpy requests
      - run: python research.py
        env:
          TWELVE_DATA_KEY: ${{ secrets.TWELVE_DATA_KEY }}
          SYMBOLS: ${{ vars.SYMBOLS_RESEARCH || 'EURUSD,GBPUSD,USDJPY,AUDUSD,XAUUSD' }}
