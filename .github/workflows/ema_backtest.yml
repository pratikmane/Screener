name: ema-backtest
on:
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas numpy requests
      - run: python ema_backtest.py
        env:
          TWELVE_DATA_KEY: ${{ secrets.TWELVE_DATA_KEY }}
          SYMBOLS: ${{ vars.EMA_SYMBOLS || 'XAUUSD' }}
          TF: ${{ vars.EMA_TF || '15min' }}
